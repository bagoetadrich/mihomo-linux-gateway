# ============================================================
# config.base.yaml —— 纯 Docker 一键部署用的公共基础模板
# 不含任何节点(节点由 merge-sources.sh 从公开源实时拉取合并)。
#
# 规则分流:
#   GEOSITE,!cn -> 代理       非中国域名走代理（优先匹配）
#   GEOSITE,cn  -> DIRECT     中国域名直连
#   GEOIP,CN    -> DIRECT     中国 IP 直连
#   MATCH       -> 代理       其余流量走代理
# 需要 geo 数据文件(geosite.dat / geoip.dat), 由 bootstrap.sh
# 启动时自动下载; 下载失败时 bootstrap 会自动注释掉这两条
# 规则退化为"全流量走代理", 保证网关始终可用。
#
# 说明:
# - 顶部的字段会被 merge-sources.sh 原样保留进最终 config
#   (HEAD 到 proxies: 为止)
# - 底部的 rules 决定流量出口(此处国内直连 + 其余代理)
# - 中间的 `proxies: []` 只是"HEAD 结束标记", 会被 merge 丢弃
# ============================================================

mixed-port: 7890
allow-lan: true
bind-address: 0.0.0.0
mode: rule
log-level: info

# 使用 geosite.dat / geoip.dat 格式(与 meta-rules-dat 分发一致)
geodata-mode: true

dns:
  enable: true
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver-policy:
    # 国内域名直接走国内 DNS, 避免 DNS 污染导致直连判断出错
    "geosite:cn": 223.5.5.5
    # 非中国域名走 Google DNS，确保解析到正确 IP
    "geosite:!cn": 8.8.8.8

proxies: []

rules:
  # 非中国域名 -> 代理（优先匹配，避免被后续 GEOIP 误判）
  - GEOSITE,!cn,🚀 节点选择
  # 中国域名 -> 直连
  - GEOSITE,cn,DIRECT
  # 中国 IP -> 直连
  - GEOIP,CN,DIRECT
  # 其余流量 -> 代理（兜底）
  - MATCH,🚀 节点选择