# ============================================================
# config.base.yaml —— 纯 Docker 一键部署用的公共基础模板
# 不含任何节点(节点由 merge-sources.sh 从公开源实时拉取合并)。
#
# 规则分流:
#   DOMAIN-SUFFIX 指定国外常见域名 -> 代理
#   GEOSITE,cn   -> DIRECT  中国域名直连
#   GEOIP,CN     -> DIRECT  中国 IP 直连
#   MATCH        -> 代理    其余流量走代理
# 需要 geo 数据文件(geosite.dat / geoip.dat), 由 bootstrap.sh
# 启动时自动下载; 下载失败时 bootstrap 会自动注释掉 GEOSITE/GEOIP 规则,
# 退化为"全流量走代理", 保证网关始终可用。
#
# 说明:
# - 顶部的字段会被 merge-sources.sh 原样保留进最终 config
#   (HEAD 到 proxies: 为止)
# - 底部的 rules 决定流量出口(此处国内直连 + 其余代理)
# - 中间的 `proxies: []` 只是"HEAD 结束标记", 会被 merge 丢弃
# ============================================================

mixed-port: 7890
allow-lan: true
bind-address: 0.0.0.0
mode: rule
log-level: info

# 使用 geosite.dat / geoip.dat 格式(与 meta-rules-dat 分发一致)
geodata-mode: true

dns:
  enable: true
  # 监听 1053, 供云服务器把手机(IKEv2 客户端)的 UDP 53 转发过来。
  # 用高位端口而不是 53: 不和本机 systemd-resolved(127.0.0.53:53) 抢端口。
  listen: 0.0.0.0:1053
  # 只返回 IPv4。隧道里没有 IPv6 通路, 返回 AAAA 只会让手机白等一轮超时。
  ipv6: false
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  # 国外/被污染域名: 用 DoH 经节点查询(走 HTTPS/TCP, 干净且不受 UDP 限制)
  fallback:
    - "https://1.1.1.1/dns-query#🚀 节点选择"
    - "https://8.8.8.8/dns-query#🚀 节点选择"
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4
  nameserver-policy:
    # 国内域名直接走国内 DNS, 避免 DNS 污染导致直连判断出错
    "geosite:cn": 223.5.5.5

# ============================================================
# 流量嗅探: 从 TLS SNI / HTTP Host 反查真实域名。
#
# 为什么需要: 手机流量经 tun2socks 到达 mihomo 时只剩 IP, 域名规则
# (DOMAIN-SUFFIX) 匹配不到, 只能靠 GEOIP 判断。一旦 DNS 拿到污染 IP,
# GEOIP 会把本该代理的域名误判成"国内直连"。
# 开启后可从 SNI 反查域名 -> 命中域名规则 -> 正确走代理。
#
# override-destination: 用嗅探到的域名作为连接目标(而不是原 IP)。
# 只嗅探 TLS/HTTP 的标准端口, 非标准协议不受影响。
# ============================================================
sniffer:
  enable: true
  override-destination: true
  sniff:
    TLS:
      ports:
        - 443
        - 8443
    HTTP:
      ports:
        - 80
        - 8080-8880
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

proxies: []

rules:
  # 强制走代理的国外域名（可按需增删）
  - DOMAIN-SUFFIX,google.com,🚀 节点选择
  - DOMAIN-SUFFIX,youtube.com,🚀 节点选择
  - DOMAIN-SUFFIX,twitter.com,🚀 节点选择
  - DOMAIN-SUFFIX,x.com,🚀 节点选择
  - DOMAIN-SUFFIX,twimg.com,🚀 节点选择
  - DOMAIN-SUFFIX,t.co,🚀 节点选择
  - DOMAIN-SUFFIX,facebook.com,🚀 节点选择
  - DOMAIN-SUFFIX,instagram.com,🚀 节点选择
  - DOMAIN-SUFFIX,github.com,🚀 节点选择
  - DOMAIN-SUFFIX,ip.sb,🚀 节点选择
  - DOMAIN-SUFFIX,cloudflare.com,🚀 节点选择
  - DOMAIN-SUFFIX,telegram.org,🚀 节点选择
  - DOMAIN-SUFFIX,whatsapp.com,🚀 节点选择
  - DOMAIN-SUFFIX,zoom.us,🚀 节点选择
  - DOMAIN-SUFFIX,netflix.com,🚀 节点选择
  - DOMAIN-SUFFIX,amazon.com,🚀 节点选择
  - DOMAIN-SUFFIX,openai.com,🚀 节点选择
  - DOMAIN-SUFFIX,chatgpt.com,🚀 节点选择

  # 中国域名 -> 直连
  - GEOSITE,cn,DIRECT
  # 中国 IP -> 直连
  - GEOIP,CN,DIRECT
  # 其余流量 -> 代理（兜底）
  - MATCH,🚀 节点选择