# ============================================================
# config.base.yaml —— 纯 Docker 一键部署用的公共基础模板
# 不含任何节点(节点由 merge-sources.sh 从公开源实时拉取合并)。
#
# 规则分流:
#   DOMAIN-SUFFIX 指定国外常见域名 -> 代理
#   GEOSITE,cn   -> DIRECT  中国域名直连
#   GEOIP,CN     -> DIRECT  中国 IP 直连
#   MATCH        -> 代理    其余流量走代理
# 需要 geo 数据文件(geosite.dat / geoip.dat), 由 bootstrap.sh
# 启动时自动下载; 下载失败时 bootstrap 会自动注释掉 GEOSITE/GEOIP 规则,
# 退化为"全流量走代理", 保证网关始终可用。
#
# 说明:
# - 顶部的字段会被 merge-sources.sh 原样保留进最终 config
#   (HEAD 到 proxies: 为止)
# - 底部的 rules 决定流量出口(此处国内直连 + 其余代理)
# - 中间的 `proxies: []` 只是"HEAD 结束标记", 会被 merge 丢弃
# ============================================================

mixed-port: 7890
allow-lan: true
bind-address: 0.0.0.0
mode: rule
log-level: info

# ============================================================
# 管理 API(供 panel 使用)
#
# 绑定回环 = 只有宿主机本地的进程和 panel 容器(host 网络)能访问,
# 不会暴露到局域网或公网。
#
# ⚠ 如果你要改成对外监听(例如 0.0.0.0:9090 给别的面板用),
#   必须同时加上 secret, 否则等于把整个代理的控制权敞开:
#       external-controller: 0.0.0.0:9090
#       secret: "换成你自己的长密码"
#   加了 secret 后, 记得在 docker-compose.yml 的 panel 服务里也设置
#   MIHOMO_SECRET 为同一个值。
# ============================================================
external-controller: 127.0.0.1:9090

# 使用 geosite.dat / geoip.dat 格式(与 meta-rules-dat 分发一致)
geodata-mode: true

dns:
  enable: true
  # 监听 1053, 供云服务器把手机(IKEv2 客户端)的 UDP 53 转发过来。
  # 用高位端口而不是 53: 不和本机 systemd-resolved(127.0.0.53:53) 抢端口。
  listen: 0.0.0.0:1053
  # 只返回 I                                                                                                                                                                                                                                                                                                                                                                                                                                                                                Pv4。隧道里没有 IPv6 通路, 返回 AAAA 只会让手机白等一轮超时。
  ipv6: false
  nameserver:
    - 223.5.5.5
    - 119.29.29.29

  # ============================================================
  # 境外/被污染域名: DoH 经节点查询(走 HTTPS/TCP, 干净且不受 UDP 限制)
  #
  # 为什么用 fallback 而不是「nameserver-policy 按域名分类」:
  #   分类写法的确省一半查询(每个境外域名只查一次 DoH), 但它让境外域名的
  #   解析**完全依赖代理节点** —— 节点一抖, 域名直接解析失败, 连接跟着报错
  #   (表现就是 SSL_ERROR_SYSCALL / 000)。
  #
  #   fallback 的机制是"nameserver 和 fallback 同时查, 再用 fallback-filter
  #   比结果"。代价是每个境外域名多 1~2 次经节点的 DoH(日志里会刷
  #   "mihomo --> 1.1.1.1:443 using 🚀 节点选择"), 但它换来了**兜底**:
  #   节点挂了 / DoH 不通时, 还能退回国内 DNS 的结果, 域名至少能解析出来。
  #
  #   免费节点本来就不稳, 所以这里「能解析」优先于「少查几次」。
  #   (等你换成稳定的自建节点后, 想省查询可以改回分类写法。)
  #
  # 注意: 下面依赖 geosite 数据。bootstrap 在 geo 下载失败时会注释掉
  # GEOSITE/GEOIP 规则并退化为"全流量走代理", 此时 "geosite:cn" 不会命中,
  # 域名会落到上面的 nameserver(国内 DNS), 网关仍能正常工作。
  # ============================================================
  fallback:
    - "https://1.1.1.1/dns-query#🚀 节点选择"
    - "https://8.8.8.8/dns-query#🚀 节点选择"
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4
  nameserver-policy:
    # 国内域名: 只查国内 DNS, 快, 且完全不碰代理
    "geosite:cn":
      - 223.5.5.5
      - 119.29.29.29

# ============================================================
# 流量嗅探: 从 TLS SNI / HTTP Host 反查真实域名。
#
# 为什么需要: 手机流量经 tun2socks 到达 mihomo 时只剩 IP, 域名规则
# (DOMAIN-SUFFIX) 匹配不到, 只能靠 GEOIP 判断。一旦 DNS 拿到污染 IP,
# GEOIP 会把本该代理的域名误判成"国内直连"。
# 开启后可从 SNI 反查域名 -> 命中域名规则 -> 正确走代理。
#
# override-destination: 用嗅探到的域名作为连接目标(而不是原 IP)。
# 只嗅探 TLS/HTTP 的标准端口, 非标准协议不受影响。
# ============================================================
sniffer:
  enable: true
  override-destination: true
  sniff:
    TLS:
      ports:
        - 443
        - 8443
    HTTP:
      ports:
        - 80
        - 8080-8880
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

proxies: []

rules:
  # 强制走代理的国外域名（可按需增删）
  - DOMAIN-SUFFIX,google.com,🚀 节点选择
  - DOMAIN-SUFFIX,youtube.com,🚀 节点选择
  - DOMAIN-SUFFIX,twitter.com,🚀 节点选择
  - DOMAIN-SUFFIX,x.com,🚀 节点选择
  - DOMAIN-SUFFIX,twimg.com,🚀 节点选择
  - DOMAIN-SUFFIX,t.co,🚀 节点选择
  - DOMAIN-SUFFIX,facebook.com,🚀 节点选择
  - DOMAIN-SUFFIX,instagram.com,🚀 节点选择
  - DOMAIN-SUFFIX,github.com,🚀 节点选择
  - DOMAIN-SUFFIX,ip.sb,🚀 节点选择
  - DOMAIN-SUFFIX,cloudflare.com,🚀 节点选择
  - DOMAIN-SUFFIX,telegram.org,🚀 节点选择
  - DOMAIN-SUFFIX,whatsapp.com,🚀 节点选择
  - DOMAIN-SUFFIX,zoom.us,🚀 节点选择
  - DOMAIN-SUFFIX,netflix.com,🚀 节点选择
  - DOMAIN-SUFFIX,amazon.com,🚀 节点选择
  - DOMAIN-SUFFIX,openai.com,🚀 节点选择
  - DOMAIN-SUFFIX,chatgpt.com,🚀 节点选择

  # 中国域名 -> 直连
  - GEOSITE,cn,DIRECT
  # 其余境外域名 -> 代理
  #
  # ★ 这条是关键。没有它的话，一个不在上面名单里的境外域名
  #   （比如 www.gstatic.com）会落到下面的 GEOIP,CN 用 IP 判断 ——
  #   一旦 DNS 被污染、返回了一个国内 IP，它就会被判成"国内"走 DIRECT，
  #   实际连到一个错误的服务器，你看到的就是:
  #       curl: (35) OpenSSL SSL_connect: SSL_ERROR_SYSCALL
  #   加上这条后，境外域名**按域名**分流，不再取决于 DNS 干不干净。
  - GEOSITE,geolocation-!cn,🚀 节点选择
  # 域名判断不出来时(纯 IP 访问)才用 IP 判断
  - GEOIP,CN,DIRECT
  # 其余流量 -> 代理（兜底）
  - MATCH,🚀 节点选择